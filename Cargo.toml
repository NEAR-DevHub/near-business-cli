[package]
name = "near-business-cli"
version = "0.2.3"
edition = "2024"
resolver = "3"
description = "Manage your confidential Near Business treasuries from the command line"
authors = ["NEAR Dev <hello@near.dev>"]
license = "MIT OR Apache-2.0"
homepage = "https://business.near.com"
repository = "https://github.com/NEAR-DevHub/near-business-cli"
readme = "README.md"
keywords = ["near", "treasury", "cli", "blockchain", "multisig"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[package.metadata.wix]
upgrade-guid = "C8868730-2B26-4088-8C2C-C4F5114A98BC"
path-guid = "27FD144A-E482-432B-99A3-31620875E466"
license = false
eula = false

[[bin]]
name = "near-business"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0.18", features = ["derive"] }
interactive-clap = "0.3"
interactive-clap-derive = "0.3"
inquire = "0.9.3"
strum = { version = "0.24", features = ["derive"] }
strum_macros = "0.24"

tokio = { version = "1.0", features = ["rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

regex = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }
color-eyre = "0.6"
shell-words = "1.0.0"
prettytable = "0.10.0"

near-crypto = "0.37"
rand = "0.8"
near-primitives = "0.37"
near-cli-rs = { version = "0.30", default-features = false }

dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha3 = "0.10"
borsh = { version = "1", features = ["derive"] }
near-token = "0.3"
uuid = { version = "1", features = ["serde"] }
colored = "3"
tracing = "0.1"
tracing-indicatif = "0.3.6"
tempfile = "3.27.0"

[features]
default = ["ledger"]
ledger = ["near-cli-rs/ledger"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
